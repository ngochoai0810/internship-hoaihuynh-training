services:
  - type: web
    name: house-price-api
    runtime: python
    plan: starter
    buildCommand: bash my-project/scripts/render_build.sh
    startCommand: bash my-project/scripts/render_start_api.sh
    disk:
      name: house-price-api-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
      - key: SECRET_KEY
        sync: false
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////var/data/app.db
      - key: MODEL_PATH
        value: /var/data/model.pkl
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: house-price-ui
    runtime: python
    plan: starter
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install -e .
    startCommand: bash my-project/scripts/render_start_streamlit.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
      - key: API_URL
        value: https://house-price-api.onrender.com
      - key: REQUEST_TIMEOUT
        value: "10"
